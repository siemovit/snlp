[project]
name = "snlp"
version = "0.1.0"
description = "Steering-vector experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.2.1",
  "huggingface-hub>=0.30.2",
  "matplotlib>=3.9",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "sae-lens>=5.2.1",
  "torch>=2.5.1",
  "transformers>=4.47.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
